services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lux3d-pg
    environment:
      POSTGRES_USER: lux3d
      POSTGRES_PASSWORD: lux3d
      POSTGRES_DB: lux3d
    ports:
      - "5433:5432"
    volumes:
      - lux3d_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lux3d -d lux3d"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lux3d_pgdata:
